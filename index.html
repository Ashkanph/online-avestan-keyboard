        "@context": "https://schema.org",

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <meta name="theme-color" content="#f6f8fc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Avestan" />
    <script>
      // Runs before first paint so a saved dark theme doesn't flash light.
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch (error) {}
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = saved || (dark ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#131416' : '#f6f8fc')
      })()
    </script>

      <h1>Online Avestan keyboard</h1>
      <p>
        A free on-screen keyboard for typing the Avestan script (Unicode block U+10B00–U+10B3F), as

        phone-style keyboard, and it can be added to the home screen to work without an internet
        connection.
      </p>

        اینترنت پس از نصب.
      </p>
